trigger:
- dev

variables:
  imageRepository: project21frontend
  containerRegistry: project21frontendtest.azurecr.io
  dockerRegistryServiceConnection: project21-acr-connection
  azureSubscription: project21-azure-connection
  dockerfilePath: Dockerfile
  tag: $(Build.BuildId)

pool:
  vmImage: ubuntu-latest

stages:

# ---------------- BUILD & PUSH ----------------

- stage: Build
  displayName: Build and Push Docker Image
  jobs:
  - job: Build
    steps:

    - checkout: self

    # Pull secrets from Azure Key Vault
    - task: AzureKeyVault@2
      inputs:
        azureSubscription: $(azureSubscription)
        KeyVaultName: project21-keyvault
        SecretsFilter: '*'
        RunAsPreJob: true

    - task: Docker@2
      displayName: Build Docker Image
      inputs:
        command: build
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        arguments: >
          --build-arg NEXT_PUBLIC_BACKEND_URL=$(NEXTPUBLICBACKENDURL)
        tags: |
          $(tag)
          latest

    - task: Docker@2
      displayName: Push Docker Image
      inputs:
        command: push
        repository: $(imageRepository)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest


# ---------------- DEPLOY ----------------

- stage: Deploy
  displayName: Deploy to Azure App Service
  dependsOn: Build
  jobs:

  - job: Deploy
    steps:

    - task: AzureWebAppContainer@1
      displayName: Deploy Container to App Service
      inputs:
        azureSubscription: $(azureSubscription)
        appName: project21-frontend
        containers: project21frontendtest.azurecr.io/project21frontend:latest