trigger:
- dev

variables:
  imageRepository: project21frontend
  containerRegistry: project21frontendtest.azurecr.io
  dockerRegistryServiceConnection: project21-acr-connection
  azureSubscription: project21-azure-connection
  dockerfilePath: Dockerfile
  tag: $(Build.BuildId)

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build
  displayName: Build and Push Image
  jobs:
  - job: Build
    steps:

    - task: Docker@2
      displayName: Build Docker Image
      inputs:
        command: build
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        arguments: >
          --build-arg NEXT_PUBLIC_BACKEND_URL=$(NEXT_PUBLIC_BACKEND_URL)
        tags: |
          $(tag)
          latest

    - task: Docker@2
      displayName: Push Docker Image
      inputs:
        command: push
        repository: $(imageRepository)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy to App Service
  dependsOn: Build
  jobs:
  - job: Deploy
    steps:

    - task: AzureWebAppContainer@1
      displayName: Deploy Container
      inputs:
        azureSubscription: $(azureSubscription)
        appName: project21-frontend
        containers: project21frontendtest.azurecr.io/project21frontend:latest